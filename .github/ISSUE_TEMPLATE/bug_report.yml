name: Bug report
description: Something does not work the way the docs say it should
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Image tag, or the commit you built from
      placeholder: public.ecr.aws/g0m7w0k0/rubberai:latest, or abc1234
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where
      options: [Server / API, Dashboard, Claude Code adapter, Collector, Python SDK, Docs, Not sure]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Set project to Full collection
        2. Send this event: ...
        3. Open the prompts table
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: Error messages, a screenshot, server log lines. Please remove API keys and anything private.
    validations:
      required: true
