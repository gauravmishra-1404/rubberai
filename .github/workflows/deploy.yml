# Builds the server image and publishes it to ECR, then asks App Runner to roll
# it out. Authentication is OIDC: the workflow assumes a role scoped to this
# repository's main branch, so no long-lived AWS key is stored in GitHub.
#
# The build happens here rather than on a developer machine or on the App
# Runner instance, which is sized to run the binary, not to compile Go and Node.
name: Deploy to App Runner

on:
  push:
    branches: [main]
    paths-ignore: [site/**, docs/**, '**.md']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: rubberai

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::201333676681:role/rubberai-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY"
          docker build --pull -t "$IMAGE:${GITHUB_SHA}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"

      # App Runner tracks :latest. Once the service exists, a push here starts a
      # deployment of the image that was just published. Before the service
      # exists the step is skipped rather than failing the build.
      - name: Roll out
        run: |
          ARN=$(aws apprunner list-services --query "ServiceSummaryList[?ServiceName=='rubberai'].ServiceArn" --output text)
          if [ -z "$ARN" ] || [ "$ARN" = "None" ]; then
            echo "App Runner service not created yet; image published only."
            exit 0
          fi
          aws apprunner start-deployment --service-arn "$ARN"
